<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #1F3A5F; margin: 0; padding: 0; background-color: #F7F7F7;">
    <div style="max-width: 800px; margin: 0 auto; padding: 20px; background-color: #ffffff;">
        
        <!-- Logo Section -->
        {{LOGO_SECTION}}
        
        <!-- Header with title -->
        <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #6B6B6B;">
            <h1 style="margin: 0; color: #1F3A5F; font-size: 24px; font-weight: 600;">{{TITLE}}</h1>
        </div>
        
        <!-- Introductory message -->
        <p style="font-size: 16px; color: #6B6B6B; margin-bottom: 30px;">{{MESSAGE}}</p>
        
        <!-- Summary Cards Section -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px;">
            
            <!-- UPDATE DATE Card -->
            <div style="background-color: #F7F7F7; border: 1px solid #6B6B6B; border-radius: 8px; padding: 15px;">
                <div style="color: #6B6B6B; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">UPDATE DATE</div>
                <div style="color: #1F3A5F; font-size: 14px; font-weight: 500;">{{UPDATE_DATE}}</div>
            </div>
            
            <!-- TIME Card -->
            <div style="background-color: #F7F7F7; border: 1px solid #6B6B6B; border-radius: 8px; padding: 15px;">
                <div style="color: #6B6B6B; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px;">TIME</div>
                <div style="color: #1F3A5F; font-size: 14px; font-weight: 500;">{{TIME}}</div>
            </div>
            
        </div>
        
        <!-- View Details Link -->
        {{VIEW_DETAILS_LINK}}
        
        <!-- Entity Details Section -->
        {{ENTITY_DETAILS}}
        
        <hr style="border: none; border-top: 1px solid #6B6B6B; margin: 30px 0 20px 0;">
        <p style="color: #6B6B6B; font-size: 12px; text-align: center; margin: 0;">This is an automated notification email.</p>
    </div>
</body>
</html>
